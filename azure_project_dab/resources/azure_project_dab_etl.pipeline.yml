# The main pipeline for azure_project_dab

resources:
  pipelines:
    azure_project_dab_etl:
      name: azure_project_dab_etl

      catalog: ${var.catalog}
      schema: ${var.schema}

      serverless: true

      root_path: "../src/silver"

      libraries:
        - glob:
            include: ../src/silver/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}